        <h1 style="margin:0; color:var(--op-blue); font-size: 28px; font-style: italic; text-shadow: 0 4px 10px rgba(0,0,0,0.8);">OPCG SIMULATOR</h1>
        <div style="text-align: left; font-size: 12px; font-weight: bold; color: #aaa;">SELECT ACTIVE DECK:</div>
        <div id="home-deck-list" style="height: 140px; overflow-y: auto; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 5px; display: flex; flex-direction: column; gap: 5px;"></div>
        <button onclick="openDeckBuilder()" style="background:var(--op-gold); color:#000; padding: 12px; font-size: 14px;">+ CREATE NEW DECK</button>
        <div style="text-align: left; font-size: 12px; font-weight: bold; color: #aaa; margin-top:5px;">SELECT PLAYMAT:</div>
        <select id="playmat-selector" style="width:100%; padding:10px; background:rgba(0,0,0,0.8); color:#fff; border:1px solid #555; border-radius:6px; font-size: 14px; outline:none; cursor:pointer;">
            <option value="https://i.imgur.com/SSN1DUI.jpeg">Yellow OP Sim</option><option value="https://i.imgur.com/WjiUDr0.jpeg">White Plain</option><option value="https://i.imgur.com/XPiIZrb.jpeg">Nami</option><option value="https://i.imgur.com/nHFYk9E.jpeg">Rebecca</option><option value="https://i.imgur.com/YTUUce7.jpeg">Beast Pirates</option><option value="https://i.imgur.com/JFXhRxJ.jpeg">Bonney</option><option value="https://i.imgur.com/0J5R5w2.jpeg">Perona</option><option value="https://i.imgur.com/Czy1zkI.jpeg">Sanji</option><option value="https://i.imgur.com/fRrCOIs.jpeg">Doflamingo</option><option value="https://i.imgur.com/dSvEKtE.jpeg">Yamato</option><option value="https://i.imgur.com/uYjfwrR.jpeg">King</option><option value="https://i.imgur.com/eJXQzGe.jpeg">Zoro</option><option value="https://i.imgur.com/h91IZyj.jpeg">Garp</option><option value="https://i.imgur.com/FN14de4.jpeg">Marco</option><option value="https://i.imgur.com/ZKhKrMl.jpeg">Luffy Gear 5</option><option value="https://i.imgur.com/0hrCVS6.jpeg">Enel</option>
        </select>
        <hr style="border-color:rgba(255,255,255,0.1); width:100%; margin: 10px 0;">
        <div style="display:flex; gap:10px;"><button onclick="createLobby()" style="flex:1; padding: 12px; background:#2ecc71; font-size:14px;">HOST LOBBY</button><button onclick="showJoinLobby()" style="flex:1; padding: 12px; background:#e67e22; font-size:14px;">JOIN LOBBY</button></div>
        <button onclick="randomMatch()" style="width:100%; padding: 12px; background:var(--op-blue); font-size:14px; margin-top:5px;">RANDOM MATCH</button>
        <hr style="border-color:rgba(255,255,255,0.1); width:100%; margin: 10px 0;">
        <button onclick="startDevMode()" style="background:#8e44ad; padding:12px; font-size:14px;">SOLO / TEST DECK</button>
    </div>
    <div class="menu-box" id="menu-join" style="display:none;">
        <h2 style="margin:0; color:#e67e22; font-size: 24px;">JOIN LOBBY</h2>
        <input type="text" id="room-code-input" placeholder="ENTER 4-LETTER CODE" style="padding:12px; font-size:20px; text-align:center; text-transform:uppercase; background:rgba(0,0,0,0.8); color:#fff; border:1px solid #555; border-radius: 6px;">
        <button onclick="joinLobby()" style="background:#e67e22; padding: 12px; font-size: 16px;">JOIN</button>
        <button onclick="backToMain()" style="background:transparent; color:#aaa; border-color:#555; padding: 12px; font-size: 14px;">BACK TO MENU</button>
    </div>
    <div class="menu-box" id="menu-deck" style="display:none;">
        <h2 style="margin:0; color:var(--op-blue); display: flex; align-items: center; justify-content: center; font-size: 24px;">LOBBY: <span id="display-room-code" style="color:#e74c3c; margin-left: 15px; letter-spacing: 2px;">----</span> </h2>
        <button onclick="copyCode()" style="background:#3498db; padding:10px 20px; width: 60%; margin: 0 auto;">COPY CODE</button>
        <p id="lobby-status" style="font-size: 16px; color: #ccc; margin-top: 15px;">Waiting for opponent to join...</p>
    </div>
</div>

<div id="sync-overlay">WAITING FOR OPPONENT...</div>
<div id="turn-indicator"></div>

<div id="visual-decklist-overlay" style="display:none; position:fixed; inset:0; background:rgba(10,10,15,0.98); z-index:9999999; flex-direction:column; padding: 40px; overflow-y:auto; box-sizing: border-box; backdrop-filter: blur(15px);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid var(--op-blue); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <h1 id="visual-decklist-title" style="color:#fff; margin:0; text-transform: uppercase; letter-spacing: 2px;">Deck Name</h1>
        <div style="display:flex; gap:15px;"><button id="btn-copy-deck-text" style="background:#3498db; padding:10px 20px; font-size:14px; color: #fff; font-weight: bold;">COPY TEXT LIST</button><button onclick="document.getElementById('visual-decklist-overlay').style.display='none'" style="background:#e74c3c; padding:10px 20px; font-size:14px; color: #fff; font-weight: bold;">CLOSE</button></div>
    </div>
    <div id="visual-decklist-content" style="display:flex; flex-direction:column; gap:30px;"></div>
</div>

<div id="left-col" class="glass-panel">
    <div class="stat-container"><div class="stat-card" style="border-color:#2ecc71;" onclick="openInspector('deck')">DECK: <span id="deck-count">0</span></div><div class="stat-card" style="border-color:#e67e22;" onclick="openInspector('trash')">TRASH: <span id="trash-count">0</span></div></div>
    <div class="stat-container"><div class="stat-card" style="border-color:#e74c3c;">LIFE: <span id="life-count">0</span></div><div class="stat-card" style="border-color:#f1c40f;">DON: <span id="don-deck-count">10</span></div></div>
    <div class="stat-card" style="background:rgba(52, 152, 219, 0.2); border-color:#3498db; margin-bottom: 5px;">OPP DON!!: <span id="opp-don">0</span></div>
    <div id="chat-container"><div id="chat-messages"></div><form id="chat-form" onsubmit="sendChat(event)"><input type="text" id="chat-input" placeholder="Chat..." autocomplete="off"><button id="chat-btn" type="submit">SEND</button></form></div>
    <div id="sidebar-manual-controls" style="display:none; margin-top:10px;"><button onclick="deckToLife()" style="background:#e74c3c; margin-bottom: 5px; width:100%; padding: 8px;">+1 LIFE FROM DECK</button><div style="display:flex; gap:5px;"><button onclick="spawnDonLocal()" style="flex:1; padding: 8px;">+ DON!!</button><button onclick="killDon()" style="flex:1; background:#e67e22; padding: 8px;">- DON!!</button></div></div>
</div>

<div id="center-col">
    <div id="opp-board" class="board-section">
        <div class="opp-hud">Hand: <span id="opp-hand-count">0</span> | Deck: <span id="opp-deck-count">0</span></div>
        <div id="opp-life-zone" class="slot life-zone"></div><div id="opp-char-zone-front" class="flex-zone char-zone"></div><div id="opp-franky-extra-zone" class="flex-zone franky-extra-zone"></div><div id="opp-leader-zone" class="slot leader-zone"></div><div id="opp-stage-zone" class="slot stage-zone"></div><div id="opp-drop-deck" class="slot drop-deck"></div><div id="opp-don-deck" class="slot don-deck"></div><div id="opp-don-zone" class="flex-zone don-zone"></div><div id="opp-drop-trash" class="slot drop-trash"></div>
    </div>
    <div id="my-board" class="board-section">
        <div id="life-zone" class="slot life-zone"></div><div id="char-zone-front" class="flex-zone char-zone"></div><div id="franky-extra-zone" class="flex-zone franky-extra-zone"></div><div id="leader-zone" class="slot leader-zone active-zone"></div><div id="stage-zone" class="slot stage-zone"></div><div id="drop-deck" class="slot drop-deck card-back"></div><div id="don-deck" class="slot don-deck"></div><div id="don-zone" class="flex-zone don-zone"></div><div id="drop-trash" class="slot drop-trash"></div>
    </div>
    <div id="hand-container">
        <div id="hand-label">Your Hand</div><div id="hand-bar" onwheel="this.scrollLeft += (event.deltaY > 0 ? 100 : -100); event.preventDefault();"></div>
    </div>
</div>

<div id="right-col" class="glass-panel">
    <div id="right-col-inspector"></div>
    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;"><button id="btn-end-turn" onclick="endTurn()">END TURN</button><button id="btn-concede" onclick="concedeGame()">CONCEDE MATCH</button></div>
</div>

<div id="combat-arena">
    <div class="arena-side"><div class="arena-img" id="arena-att-img"></div><div class="arena-power" id="arena-att-pow">0</div></div>
    <div class="arena-center"><h1>VS</h1><div class="arena-status" id="arena-status">Waiting for Blocks...</div><div class="arena-math" id="arena-math"></div></div>
    <div class="arena-side"><div class="arena-img" id="arena-def-img"></div><div class="arena-power" id="arena-def-pow">0</div></div>
</div>

<div id="counter-controls">
    <div style="color:white; font-weight:bold; font-size: 18px; text-transform: uppercase;">Select Counters</div>
    <button onclick="confirmCounter()" style="background:#2ecc71; padding:12px 25px; font-size:14px;">CONFIRM DEFENSE</button>
    <button onclick="takeHit()" style="background:#e74c3c; padding:12px 25px; font-size:14px;">TAKE HIT (0)</button>
</div>

<div id="select-overlay"></div>
<div id="select-msg" style="display:none;"><span id="select-text">SELECT A TARGET</span> <button onclick="cancelSelection()" style="background:#c0392b; border:2px solid #fff; padding:8px 16px;">CANCEL</button></div>

<div id="custom-modal-overlay">
    <div id="custom-modal-box">
        <h3 id="custom-modal-msg">Message</h3>
        <input type="text" id="custom-modal-input" style="display:none;">
        <div style="display:flex; gap:10px; justify-content:center;" id="custom-modal-btn-container"><button class="modal-btn" id="custom-modal-btn-1" style="background:#2ecc71;">YES</button><button class="modal-btn" id="custom-modal-btn-2" style="background:#e74c3c;">NO</button></div>
    </div>
</div>

<div id="context-menu"></div><div id="zoom-overlay" onclick="this.style.display='none'"><img id="zoom-img" src=""></div>

<script src="/socket.io/socket.io.js"></script>

<script src="logic_red.js?v=2.0"></script>
<script src="logic_purple.js?v=2.0"></script>
<script src="logic_yellow.js?v=2.0"></script>
<script src="logic_blue_black.js?v=2.0"></script>
<script src="engine.js?v=2.0"></script>

</body>
