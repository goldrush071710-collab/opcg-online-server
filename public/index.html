<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece TCG - Master Engine</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* === GLOBAL VISUALS === */
        :root {
            --red: #ff4d4d; --purple: #a366ff; --yellow: #fffa65;
            --green: #32ff7e; --blue: #18dcff; --black: #2f3542;
            --card-w: 100px; --card-h: 140px;
        }
        body { background: #1e272e; color: white; font-family: sans-serif; margin: 0; overflow: hidden; user-select: none; }
        .hidden { display: none !important; }
        .btn { padding: 10px 15px; background: #ff4d4d; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        .btn:hover { background: #ff7979; }

        /* === DECK BUILDER UI === */
        #deck-builder-screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; background: #2f3640; }
        #db-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #db-workspace { display: flex; gap: 20px; height: 100%; }
        .db-panel { background: #1e272e; border: 2px solid #555; border-radius: 8px; padding: 15px; overflow-y: auto; }
        #card-pool { flex: 2; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
        #current-deck { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        
        /* === GAME BOARD UI === */
        #game-board-screen { display: grid; grid-template-rows: 1fr 1fr; height: 100vh; width: 100vw; }
        .player-area { border: 1px solid #3d3d3d; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 20px; position: relative;}
        .field { display: flex; gap: 15px; height: 160px; align-items: center; min-width: 800px; border-bottom: 1px dashed #555; }
        .hand { display: flex; gap: 10px; height: 150px; padding: 10px; background: rgba(0,0,0,0.5); width: 100%; justify-content: center; overflow-x: auto; }
        .leader-zone { position: absolute; left: 50px; top: 50%; transform: translateY(-50%); border: 2px solid gold; width: var(--card-w); height: var(--card-h); }
        .stage-zone { position: absolute; right: 50px; top: 50%; transform: translateY(-50%); border: 2px dashed #888; width: var(--card-w); height: var(--card-h); }
        .don-zone { position: absolute; right: 200px; bottom: 10px; font-size: 20px; font-weight: bold; color: gold; }
        
        /* === CARDS === */
        .card { width: var(--card-w); height: var(--card-h); border-radius: 8px; border: 2px solid #fff; background: #2f3542; cursor: pointer; transition: 0.2s; position: relative; font-size: 10px; padding: 5px; box-sizing: border-box; text-align: center; }
        .card:hover { border-color: gold; transform: translateY(-5px); z-index: 10; }
        .card.rested { transform: rotate(90deg) !important; border-color: #ff4d4d; }
        .don-attached { position: absolute; bottom: -10px; right: -10px; background: gold; color: black; border-radius: 50%; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid black; }

        /* === MODALS === */
        #ui-panel { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); background: #111; padding: 15px; border: 2px solid gold; border-radius: 8px; z-index: 50; }
        #combat-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; padding: 20px; border: 2px solid red; z-index: 100; text-align: center; border-radius: 8px; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
    </style>
</head>

    // ==========================================
// 3. DECK BUILDER LOGIC
// ==========================================
function initDeckBuilder() {
    const pool = document.getElementById('card-pool');
    for (const key in CARD_DB) {
        const c = CARD_DB[key];
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<b>${c.name}</b><br/>${c.type}<br/>Cost: ${c.cost || '-'}<br/>Pwr: ${c.power || '-'}`;
        div.onclick = () => addToDeck(key);
        pool.appendChild(div);
    }
}

function addToDeck(cardId) {
    if (myDeck.length >= 50 && CARD_DB[cardId].type !== "Leader") return alert("Deck full! (50 cards max)");
    
    if (CARD_DB[cardId].type === "Leader") {
        myLeader = { ...CARD_DB[cardId], state: "Active", attachedDon: 0, tempPower: 0 };
        return alert(`Leader set to: ${myLeader.name}`);
    }
    
    // Create a unique instance of the card
    myDeck.push({ 
        ...CARD_DB[cardId], 
        instanceId: Math.random().toString(36).substr(2, 9), 
        state: "Active", 
        attachedDon: 0, 
        turnPlayed: 0,
        tempPower: 0
    });
    updateDeckUI();
}

function updateDeckUI() {
    document.getElementById('deck-count').innerText = myDeck.length;
    const list = document.getElementById('deck-list');
    list.innerHTML = '';
    myDeck.forEach((c, idx) => {
        const div = document.createElement('div');
        div.innerText = c.name;
        div.style.cursor = "pointer";
        div.onclick = () => { myDeck.splice(idx, 1); updateDeckUI(); };
        list.appendChild(div);
    });
}

function saveDeck() {
    if (!myLeader) return alert("You must select a Leader!");
    if (myDeck.length < 50) return alert("You need exactly 50 cards in your main deck!");
    alert("Deck saved securely!");
}

function startGame() {
    if (!myLeader || myDeck.length < 50) return alert("Finish building your deck first!");
    document.getElementById('deck-builder-screen').classList.add('hidden');
    document.getElementById('game-board-screen').classList.remove('hidden');
    document.getElementById('ui-panel').classList.remove('hidden');
    
    // Shuffle and Draw 5
    myDeck.sort(() => Math.random() - 0.5);
    for(let i=0; i<5; i++) drawCard();
    renderBoard();
}

// ==========================================
// 4. CORE ENGINE & DON!! MANAGEMENT
// ==========================================
function drawCard() {
    if (myDeck.length === 0) return alert("Deck out! You lose.");
    myHand.push(myDeck.shift());
}

function updateDonUI() {
    document.getElementById('active-don').innerText = myDon.active;
    document.getElementById('total-don').innerText = myDon.active + myDon.rested + myDon.attached;
}

function passTurn() {
    // End of Turn rule: Reset OPT Flags
    if (myLeader) myLeader.usedMainAbility = false;
    myField.forEach(c => c.usedMainAbility = false);
    
    globalState.myTurn = false;
    socket.emit('game_action', { type: 'pass_turn' });
}

// ==========================================
// 5. THE 4-STEP COMBAT MACHINE
// ==========================================
function getCardPower(cardObj) {
    // Formula: Base Power + Temp Buffs + (Attached DON!! * 1000)
    return cardObj.power + (cardObj.tempPower || 0) + ((cardObj.attachedDon || 0) * 1000);
}

// STEP 1: ATTACK DECLARATION
function declareAttack(attackerObj, defenderObj) {
    if (!globalState.myTurn) return alert("Not your turn!");
    if (attackerObj.state === "Rested") return alert("Attacker is already rested!");
    
    // Summoning Sickness Override Rule
    if (attackerObj.type === "Character") {
        let canAttack = (attackerObj.turnPlayed < globalState.turnCounter) || attackerObj.keywords.rush;
        if (!canAttack) return alert("This character has Summoning Sickness!");
    }

    // Target Validation Rule
    if (defenderObj.type === "Character" && defenderObj.state === "Active") {
        return alert("You can only attack Rested characters or the Leader!");
    }

    // Execution
    attackerObj.state = "Rested"; 
    CombatState.isActive = true;
    CombatState.attackerCard = attackerObj;
    CombatState.defenderCard = defenderObj;
    CombatState.step = 1;

    console.log(`[Combat] Step 1: ${attackerObj.name} attacks ${defenderObj.name}`);
    
    // Trigger [When Attacking] logic would fire here
    
    // Proceed to Block/Counter step
    socket.emit('game_action', { type: 'attack_declared', attacker: attackerObj, defender: defenderObj });
    promptCounterStep(); // Firing locally for now
}

// STEP 2 & 3: BLOCK / COUNTER STEP
function promptCounterStep() {
    CombatState.step = 3;
    CombatState.counterPower = 0;
    
    const modal = document.getElementById('combat-modal');
    modal.style.display = 'block';
    document.getElementById('atk-power').innerText = getCardPower(CombatState.attackerCard);
    updateCounterUI();
}

function updateCounterUI() {
    let baseDef = getCardPower(CombatState.defenderCard);
    document.getElementById('def-power').innerText = baseDef + CombatState.counterPower;
}

// STEP 4: DAMAGE & RESOLUTION
function resolveDamageStep() {
    CombatState.step = 4;
    document.getElementById('combat-modal').style.display = 'none';

    let finalAtk = getCardPower(CombatState.attackerCard);
    let finalDef = getCardPower(CombatState.defenderCard) + CombatState.counterPower;

    console.log(`[Combat] Step 4: ATK(${finalAtk}) vs DEF(${finalDef})`);

    if (finalAtk >= finalDef) {
        console.log("[Combat] Attack Succeeds! Ties go to the attacker.");
        if (CombatState.defenderCard.type === "Character") {
            console.log(`${CombatState.defenderCard.name} is K.O.'d! Moving to Trash.`);
            // K.O. Logic: Return attached DON rested, remove from field.
        } else {
            let dmg = CombatState.attackerCard.keywords && CombatState.attackerCard.keywords.doubleAttack ? 2 : 1;
            console.log(`[Combat] Leader takes ${dmg} damage! Proceed to Trigger check.`);
            // Banish logic & Win Condition check goes here.
        }
    } else {
        console.log("[Combat] Attack Fails! Nothing happens.");
    }

    // Combat Cleanup Rule
    CombatState.isActive = false;
    CombatState.attackerCard = null;
    CombatState.defenderCard = null;
    CombatState.counterPower = 0;
    CombatState.step = 0;
    // Clear "During this battle" buffs here
    
    renderBoard();
}

// ==========================================
// 6. UI RENDERER & INIT
// ==========================================
function renderBoard() {
    // Render Hand
    const handDiv = document.getElementById('my-hand');
    handDiv.innerHTML = '';
    myHand.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<b>${c.name}</b><br/>Cost: ${c.cost}<br/>Pwr: ${c.power}`;
        handDiv.appendChild(div);
    });

    // Render Leader
    if (myLeader) {
        const leadDiv = document.getElementById('my-leader');
        leadDiv.className = `leader-zone card ${myLeader.state === "Rested" ? "rested" : ""}`;
        leadDiv.innerHTML = `<b>${myLeader.name}</b><br/>Life: ${myLeader.life}<br/>Pwr: ${getCardPower(myLeader)}`;
        if (myLeader.attachedDon > 0) {
            leadDiv.innerHTML += `<div class="don-attached">${myLeader.attachedDon}</div>`;
        }
    }
}

window.onload = initDeckBuilder;

</script>
